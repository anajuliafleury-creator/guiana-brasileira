<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guiana Brasileira</title>
<style>
  body { margin: 0; background: #1e2b37; font-family: Arial, sans-serif; color: white; text-align: center; }
  #topo { padding: 8px; font-size: 14px; }
  #topo input[type=text] { padding: 6px; border-radius: 6px; border: none; width: 140px; }
  #topo input[type=color] { vertical-align: middle; border: none; width: 36px; height: 30px; background: none; }
  #topo button { padding: 6px 12px; border: none; border-radius: 6px; background: #f1c40f; cursor: pointer; font-weight: bold; }
  #dica { font-size: 12px; opacity: 0.7; margin-left: 8px; }
  canvas { display: block; margin: 0 auto; cursor: pointer; max-width: 100vw; max-height: calc(100vh - 56px); }
</style>
</head>
<body>
<div id="topo">
  Nome: <input type="text" id="nome" maxlength="14" placeholder="Seu nome">
  Cor: <input type="color" id="cor" value="#e74c3c">
  <button id="ok">Entrar na vila</button>
  <span id="dica">Clique no chão ou numa loja para andar.</span>
</div>
<canvas id="tela" width="896" height="1200"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const tela = document.getElementById('tela');
const ctx = tela.getContext('2d');

const fundo = new Image();
fundo.src = 'image_7175d5d7.jpg';

let meuId = null;
const jogadores = {};

// Lojas: área clicável (x, y, l, a) e ponto de chegada na frente da porta
const lojas = [
  { nome: 'Nossa Rosa',   x: 0,   y: 390, l: 315, a: 280, portaX: 195, portaY: 715 },
  { nome: 'Onça Pintada', x: 315, y: 345, l: 310, a: 305, portaX: 460, portaY: 705 },
  { nome: 'Vish Sô',      x: 625, y: 395, l: 271, a: 295, portaX: 715, portaY: 725 }
];

socket.on('estadoInicial', (dados) => {
  meuId = dados.meuId;
  Object.assign(jogadores, dados.jogadores);
});
socket.on('jogadorEntrou', (j) => { jogadores[j.id] = j; });
socket.on('jogadorSaiu', (id) => { delete jogadores[id]; });
socket.on('perfilAtualizado', (p) => {
  if (jogadores[p.id]) { jogadores[p.id].nome = p.nome; jogadores[p.id].cor = p.cor; }
});
socket.on('posicoes', (pos) => {
  for (const id in pos) {
    if (jogadores[id]) { jogadores[id].x = pos[id].x; jogadores[id].y = pos[id].y; }
  }
});

function entrar() {
  socket.emit('definirPerfil', {
    nome: document.getElementById('nome').value,
    cor: document.getElementById('cor').value
  });
}
document.getElementById('ok').onclick = entrar;
document.getElementById('nome').onkeydown = (e) => { if (e.key === 'Enter') entrar(); };

// Clique (ou toque) para andar
tela.addEventListener('click', (e) => {
  const r = tela.getBoundingClientRect();
  const x = (e.clientX - r.left) * (tela.width / r.width);
  const y = (e.clientY - r.top) * (tela.height / r.height);
  for (const loja of lojas) {
    if (x > loja.x && x < loja.x + loja.l && y > loja.y && y < loja.y + loja.a) {
      socket.emit('andarPara', { x: loja.portaX, y: loja.portaY });
      return;
    }
  }
  socket.emit('andarPara', { x, y });
});

const ESC = 1.5; // tamanho dos personagens

function desenharJogador(j) {
  ctx.save();
  ctx.translate(j.x, j.y);
  ctx.scale(ESC, ESC);
  // sombra
  ctx.fillStyle = 'rgba(60,80,110,0.3)';
  ctx.beginPath(); ctx.ellipse(0, 22, 14, 6, 0, 0, Math.PI * 2); ctx.fill();
  // corpo
  ctx.fillStyle = j.cor;
  ctx.fillRect(-10, -6, 20, 26);
  // cabeça
  ctx.fillStyle = '#ffd7b0';
  ctx.beginPath(); ctx.arc(0, -14, 11, 0, Math.PI * 2); ctx.fill();
  // gorro de inverno
  ctx.fillStyle = j.cor;
  ctx.beginPath(); ctx.arc(0, -17, 11, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(-11, -18, 22, 4);
  ctx.beginPath(); ctx.arc(0, -29, 3.5, 0, Math.PI * 2); ctx.fill();
  // olhos
  ctx.fillStyle = '#222';
  ctx.fillRect(-5, -14, 3, 3);
  ctx.fillRect(2, -14, 3, 3);
  ctx.restore();
  // nome
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 4;
  ctx.font = 'bold 18px Arial';
  ctx.textAlign = 'center';
  ctx.strokeText(j.nome, j.x, j.y - 58);
  ctx.fillText(j.nome, j.x, j.y - 58);
}

function desenhar() {
  ctx.clearRect(0, 0, tela.width, tela.height);
  if (fundo.complete && fundo.naturalWidth) {
    ctx.drawImage(fundo, 0, 0, tela.width, tela.height);
  } else {
    ctx.fillStyle = '#dcebf7';
    ctx.fillRect(0, 0, tela.width, tela.height);
  }
  // quem está mais abaixo aparece na frente
  Object.values(jogadores)
    .sort((a, b) => a.y - b.y)
    .forEach(desenharJogador);
  requestAnimationFrame(desenhar);
}
desenhar();
</script>
</body>
</html>
